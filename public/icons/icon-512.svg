<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="55%" stop-color="#E8A020"/>
      <stop offset="100%" stop-color="#C96B0A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="92" fill="url(#bgGrad)"/>

  <!-- Candlestick chart (background decoration) -->
  
      <line x1="141.5" y1="223" x2="141.5" y2="315" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
      <rect x="118.5" y="246" width="46" height="23" fill="#22c55e" fill-opacity="0.5" rx="3"/>
    
      <line x1="198.5" y1="200" x2="198.5" y2="280.5" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
      <rect x="175.5" y="246" width="46" height="34.5" fill="#ef4444" fill-opacity="0.5" rx="3"/>
    
      <line x1="255.5" y1="234.5" x2="255.5" y2="303.5" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
      <rect x="232.5" y="257.5" width="46" height="23" fill="#22c55e" fill-opacity="0.5" rx="3"/>
    
      <line x1="312.5" y1="177" x2="312.5" y2="269" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
      <rect x="289.5" y="188.5" width="46" height="69" fill="#22c55e" fill-opacity="0.5" rx="3"/>
    
      <line x1="369.5" y1="165.5" x2="369.5" y2="223" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
      <rect x="346.5" y="177" width="46" height="11.5" fill="#22c55e" fill-opacity="0.5" rx="3"/>
    

  <!-- "C" monogram in gold gradient -->
  <text x="256" y="348" text-anchor="middle"
        font-family="monospace, sans-serif" font-size="266" font-weight="bold"
        fill="url(#textGrad)" opacity="0.95">C</text>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="92" fill="none" stroke="#E8A020" stroke-opacity="0.2" stroke-width="2"/>
</svg>